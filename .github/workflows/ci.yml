name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Opt out of DeepEval's anonymous usage telemetry; the suite is fully offline.
      DEEPEVAL_TELEMETRY_OPT_OUT: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: python -m py_compile src/offline_judge.py src/custom_geval.py src/check_thresholds.py

      - name: Run offline metric tests
        # No secrets, no API keys: all judge calls are stubbed.
        run: pytest -v

      - name: Threshold gate
        run: python src/check_thresholds.py
